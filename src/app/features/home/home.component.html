<div class="max-w-7xl mx-auto px-6 py-12 space-y-10">

  <!-- 🔍 BARRE DE RECHERCHE -->
  <div class="relative group max-w-2xl mx-auto">
    <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
      <span class="text-gray-400">🔍</span>
    </div>
    <input type="text" [(ngModel)]="searchQuery"
           placeholder="Rechercher un produit ou un SKU..."
           class="w-full pl-12 pr-4 py-4 bg-white border border-gray-100 rounded-3xl shadow-sm outline-none focus:ring-2 focus:ring-blue-500 transition-all text-sm font-medium">
  </div>
  <!-- 🏷️ BARRE DE CATÉGORIES -->
  <div class="flex flex-wrap items-center justify-center gap-2">
    <button (click)="loadProducts('Tous')"
            [class]="selectedCategory() === 'Tous' ? 'bg-slate-900 text-white shadow-lg shadow-gray-200' : 'bg-white text-gray-500 hover:bg-gray-50'"
            class="px-6 py-2 rounded-full text-xs font-black uppercase tracking-widest transition-all border border-transparent">
      Tous
    </button>

    @for (cat of categories(); track cat) {
      <button (click)="loadProducts(cat)"
              [class]="selectedCategory() === cat ? 'bg-slate-900 text-white shadow-lg shadow-gray-200' : 'bg-white text-gray-500 hover:bg-gray-50'"
              class="px-6 py-2 rounded-full text-xs font-black uppercase tracking-widest transition-all border border-transparent">
        {{ cat }}
      </button>
    }
  </div>
  <!-- 📦 GRILLE DES PRODUITS -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
    @for (product of filteredProducts(); track product.id) {
      <div class="group bg-white rounded-3xl p-4 border border-gray-100 hover:shadow-2xl hover:shadow-blue-50 transition-all duration-300">
        <!-- Image -->
        <div class="aspect-square rounded-2xl overflow-hidden bg-gray-50 mb-4 relative">
          <img [src]="product.imageUrl || 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?q=80&w=2070&auto=format&fit=crop'"
               class="w-full h-full object-cover" [alt]="product.name">
        </div>
        <!-- Details -->
        <h3 class="font-bold text-gray-800 line-clamp-1 m-1">{{ product.name }}</h3>
        <p class="text-[10px] text-gray-400 font-mono uppercase px-1 mb-4">{{ product.sku }}</p>

        <div class="flex items-center justify-between mt-2 px-1">
          <span class="text-xl font-black text-blue-600">{{ product.costPrice }} DH</span>
          <button (click)="addToCart(product)" class="bg-gray-50 text-gray-900 p-2.5 rounded-xl hover:bg-slate-900 hover:text-white transition transform active:scale-95 shadow-sm">
            🛒
          </button>
        </div>
      </div>
    } @empty {
      <div class="col-span-full py-20 text-center opacity-50">
        <span class="text-5xl mb-4 block">🔍</span>
        <p class="font-bold text-gray-400 uppercase tracking-widest text-xs">Aucun produit ne correspond à votre recherche</p>
      </div>
    }
  </div>
</div>
