<div class="space-y-6">
  <div class="flex justify-between items-center text-gray-800">
    <h1 class="text-3xl font-black tracking-tight">Nos <span class="text-blue-600">Entrepôts</span></h1>

    <!-- ICI : On ajoute le </a> qui manquait à la fin -->
    <a routerLink="/admin/warehouses/new"
       class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-blue-700 shadow-lg shadow-blue-100 transition">
      + Nouvel Entrepôt
    </a>
  </div>
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden text-gray-700 text-sm">
    <table class="w-full text-left">
      <thead class="bg-gray-50 text-gray-400 text-[10px] uppercase tracking-widest font-black">
        <tr>
          <th class="px-6 py-4">Image</th>
          <th class="px-6 py-4">Code / Nom</th>
          <th class="px-6 py-4">Statut</th>
          <th class="px-6 py-4 text-right">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100">
        @for (w of warehouses; track w.id) {
          <tr class="hover:bg-blue-50/50 transition">
            <td class="px-6 py-4">
              <img [src]="defaultImage" class="w-10 h-10 object-contain p-1 bg-gray-50 rounded-lg">
            </td>
            <td class="px-6 py-4">
              <div class="text-blue-500 font-mono text-xs font-bold mb-0.5">{{ w.code }}</div>
              <div class="font-bold">{{ w.name }}</div>
            </td>
            <td class="px-6 py-4">
              <span [class]="w.active ? 'text-green-600 bg-green-50' : 'text-red-600 bg-red-50'"
                    class="px-2 py-1 rounded text-[10px] font-black uppercase">
                {{ w.active ? 'Opérationnel' : 'Inactif' }}
              </span>
            </td>
            <td class="px-6 py-4 text-right">
          <!-- 📝 Nouveau lien pour modifier -->
              <a [routerLink]="['/admin/warehouses/edit', w.id]"
                class="text-blue-600 hover:text-blue-800 text-xs font-black uppercase tracking-tighter transition">
                Modifier
              </a>
              <button (click)="onDelete(w.id!)"
                class="text-red-500 hover:text-red-700 text-xs font-black uppercase tracking-tighter transition">
                  Supprimer
              </button>
          </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4" class="px-6 py-20 text-center">
              <p class="text-gray-400 font-medium italic">
                {{ loading ? 'Chargement...' : 'Aucun entrepôt répertorié.' }}
              </p>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
