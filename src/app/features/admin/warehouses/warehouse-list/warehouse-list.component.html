<!-- 🎨 Premium Light Mode Warehouse List -->
<div class="space-y-6">

  <!-- Header -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
    <div>
      <h1 class="text-3xl font-bold text-slate-800">Nos <span class="text-blue-600">Entrepôts</span></h1>
      <p class="text-gray-500 mt-1">Gérez vos sites de stockage</p>
    </div>
    <a routerLink="/admin/warehouses/new"
      class="flex items-center px-6 py-3 bg-blue-500 hover:bg-blue-600 text-white font-semibold rounded-xl shadow-button hover:shadow-button-hover transition-all duration-300 btn-ripple">
      <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
      </svg>
      Nouvel Entrepôt
    </a>
  </div>

  <!-- Table Card -->
  <div class="bg-white rounded-2xl shadow-soft border border-gray-100 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full">
        <thead class="bg-gray-50 border-b border-gray-100">
          <tr>
            <th class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Icon</th>
            <th class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Code / Nom</th>
            <th class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Statut</th>
            <th class="px-6 py-4 text-right text-xs font-semibold text-gray-600 uppercase tracking-wider">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
          @for (w of warehouses; track w.id) {
          <tr class="hover:bg-blue-50/30 transition-colors group">
            <td class="px-6 py-4">
              <div
                class="w-12 h-12 bg-gradient-to-br from-blue-100 to-violet-100 rounded-xl flex items-center justify-center">
                <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4">
                  </path>
                </svg>
              </div>
            </td>
            <td class="px-6 py-4">
              <div class="text-xs text-blue-600 font-semibold mb-1">{{ w.code }}</div>
              <div class="font-medium text-slate-800 group-hover:text-blue-600 transition-colors">{{ w.name }}</div>
            </td>
            <td class="px-6 py-4">
              <span [ngClass]="w.active ? 'bg-emerald-50 text-emerald-600' : 'bg-red-50 text-red-600'"
                class="inline-flex items-center px-3 py-1 text-xs font-semibold rounded-full">
                <span class="w-1.5 h-1.5 rounded-full mr-1.5"
                  [ngClass]="w.active ? 'bg-emerald-500 animate-pulse' : 'bg-red-500'"></span>
                {{ w.active ? 'Opérationnel' : 'Inactif' }}
              </span>
            </td>
            <td class="px-6 py-4 text-right space-x-2">
              <a [routerLink]="['/admin/warehouses/edit', w.id]"
                class="inline-flex items-center px-3 py-1.5 text-sm font-medium text-blue-600 hover:text-blue-700 hover:bg-blue-50 rounded-lg transition-colors">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z">
                  </path>
                </svg>
                Modifier
              </a>
              <button (click)="onDelete(w.id!)"
                class="inline-flex items-center px-3 py-1.5 text-sm font-medium text-red-600 hover:text-red-700 hover:bg-red-50 rounded-lg transition-colors">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                  </path>
                </svg>
                Supprimer
              </button>
            </td>
          </tr>
          } @empty {
          <tr>
            <td colspan="4" class="px-6 py-20 text-center">
              <div class="flex flex-col items-center justify-center">
                <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mb-4">
                  <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4">
                    </path>
                  </svg>
                </div>
                <p class="text-gray-500 font-medium">
                  {{ loading ? 'Chargement...' : 'Aucun entrepôt répertorié.' }}
                </p>
              </div>
            </td>
          </tr>
          }
        </tbody>
      </table>
    </div>
  </div>

</div>
