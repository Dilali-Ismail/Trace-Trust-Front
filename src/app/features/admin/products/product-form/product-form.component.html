<div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow-sm border">
  <h2 class="text-2xl font-bold mb-6 text-gray-800">
    {{ isEdit ? 'Modifier le produit' : 'Nouveau Produit' }}
  </h2>
  <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-bold text-gray-400 uppercase">SKU</label>
        <input type="text" formControlName="sku" class="w-full border-gray-200 rounded-lg p-2 bg-gray-50">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-400 uppercase">Nom</label>
        <input type="text" formControlName="name" class="w-full border-gray-200 rounded-lg p-2 bg-gray-50">
      </div>
    </div>
    <div>
      <label class="block text-xs font-bold text-gray-400 uppercase">Catégorie</label>
      <select formControlName="category" class="w-full border-gray-200 rounded-lg p-2 bg-gray-50">
        <option value="ELECTRONICS">Électronique</option>
        <option value="FURNITURE">Mobilier</option>
        <option value="FOOD">Alimentaire</option>
        <option value="FASHION">Mode &amp; Vêtements</option>
        <option value="HOME_DECOR">Maison &amp; Décoration</option>
        <option value="BEAUTY_HEALTH">Beauté &amp; Santé</option>
        <option value="SPORT_LEISURE">Sport &amp; Loisirs</option>
        <option value="PHONES_ACCESSORIES">Téléphones &amp; Accessoires</option>
      </select>
    </div>
    <div>
      <label class="block text-xs font-bold text-gray-400 uppercase">Prix Coûtant (€)</label>
      <input type="number" formControlName="costPrice" class="w-full border-gray-200 rounded-lg p-2 bg-gray-50">
    </div>
    <div>
      <label class="block text-xs font-bold text-gray-400 uppercase">Image du produit</label>
      <input type="file" (change)="onFileSelected($event)" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-blue-50 file:text-blue-700">
    </div>
    <div class="flex items-center space-x-2">
      <input type="checkbox" formControlName="active" id="active">
      <label for="active" class="text-sm">Produit Actif</label>
    </div>
    <div class="pt-4 flex justify-end space-x-3 text-sm font-bold">
      <button type="button" routerLink="/admin/products" class="text-gray-400">Annuler</button>
      <button type="submit" [disabled]="productForm.invalid" class="bg-blue-600 text-white px-6 py-2 rounded-lg">
        Enregistrer
      </button>
    </div>
  </form>
</div>
