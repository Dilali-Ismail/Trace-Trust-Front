<div class="space-y-6">
  <div class="flex justify-between items-center text-gray-800">
    <h1 class="text-3xl font-black tracking-tight">Gestion des <span class="text-blue-600">Utilisateurs</span></h1>
    <a routerLink="/admin/users/new"
       class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-blue-700 shadow-lg shadow-blue-100 transition">
      + Créer un Manager
    </a>
  </div>
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden text-gray-700">
    <table class="w-full text-left">
      <thead class="bg-gray-50 text-gray-400 text-[10px] uppercase tracking-widest font-black">
        <tr>
          <th class="px-6 py-4">Utilisateur</th>
          <th class="px-6 py-4">Rôle</th>
          <th class="px-6 py-4">Statut</th>
          <th class="px-6 py-4 text-right">Action</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100">
        @for (u of users; track u.id) {
          <tr class="hover:bg-blue-50/50 transition text-sm">
            <td class="px-6 py-4">
              <div class="font-bold text-gray-900">{{ u.name }}</div>
              <div class="text-xs text-gray-400">{{ u.email }}</div>
            </td>
            <td class="px-6 py-4">
              <span [ngClass]="{
                'bg-purple-50 text-purple-600': u.role === 'ADMIN',
                'bg-orange-50 text-orange-600': u.role === 'WAREHOUSE_MANAGER',
                'bg-blue-50 text-blue-600': u.role === 'CLIENT'
              }" class="px-2 py-1 rounded text-[10px] font-black tracking-tighter uppercase">
                {{ u.role }}
              </span>
            </td>
            <td class="px-6 py-4">
              <span [class]="u.active ? 'text-green-600' : 'text-red-600'" class="font-bold">
                {{ u.active ? '● Actif' : '● Suspendu' }}
              </span>
            </td>
            <td class="px-6 py-4 text-right">
              <button (click)="onToggleStatus(u)"
                [class]="u.active ? 'text-red-500 hover:text-red-700' : 'text-green-500 hover:text-green-700'"
                class="text-[10px] font-black uppercase tracking-widest underline decoration-2 underline-offset-4">
                {{ u.active ? 'Désactiver' : 'Activer' }}
              </button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4" class="px-6 py-20 text-center text-gray-400 italic">
              {{ loading ? 'Chargement des utilisateurs...' : 'Aucun utilisateur trouvé.' }}
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
