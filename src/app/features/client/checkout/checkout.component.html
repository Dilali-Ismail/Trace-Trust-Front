<div class="max-w-4xl mx-auto p-12">
  <h1 class="text-4xl font-black mb-8">Valider mon Panier 🛒</h1>

  <div class="bg-white rounded-3xl p-8 shadow-sm border border-gray-100">
    <div class="divide-y divide-gray-50">
      @for (item of cart.items(); track item.productId) {
      <div class="py-4 flex justify-between items-center">
        <div>
          <p class="font-bold text-gray-800">{{ item.productName }}</p>
          <p class="text-xs text-gray-400 font-mono">{{ item.unitPrice }} DH x {{ item.quantity }}</p>
        </div>
        <div class="flex items-center gap-6">
          <div class="flex items-center bg-gray-50 rounded-2xl p-1 border border-gray-100 italic">
            <button (click)="decrement(item.productId, item.quantity)"
              class="w-10 h-10 flex items-center justify-center hover:bg-white hover:shadow-sm rounded-xl transition text-gray-500 font-bold">-</button>
            <span class="w-12 text-center font-black text-slate-900">{{ item.quantity }}</span>
            <button (click)="increment(item.productId, item.quantity)"
              class="w-10 h-10 flex items-center justify-center hover:bg-white hover:shadow-sm rounded-xl transition text-gray-500 font-bold">+</button>
          </div>
          <span class="font-black text-slate-900 min-w-[80px] text-right">{{ item.unitPrice * item.quantity }} DH</span>
        </div>
      </div>
      }
    </div>
    <div class="mt-8 pt-6 border-t border-gray-100 flex items-center justify-between">
      <div>
        <p class="text-xs text-gray-400 uppercase font-black tracking-widest">Total à payer</p>
        <p class="text-3xl font-black text-blue-600">{{ cart.total() }} DH</p>
      </div>
      <button (click)="submitOrder()" [disabled]="cart.count() === 0"
        class="bg-slate-900 text-white px-10 py-4 rounded-2xl font-black hover:bg-blue-600 transition shadow-xl disabled:opacity-20 active:scale-95">
        Confirmer la Commande
      </button>
    </div>
  </div>
</div>
