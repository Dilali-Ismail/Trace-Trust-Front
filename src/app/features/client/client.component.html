<div class="max-w-5xl mx-auto p-10 space-y-8">
  <h1 class="text-4xl font-black">Mes Commandes 📜</h1>
  <div class="grid gap-4">
    @for (order of orders(); track order.id) {
    <div
      class="bg-white p-6 rounded-3xl border border-gray-100 flex items-center justify-between hover:shadow-lg transition">
      <div>
        <p class="text-[10px] font-mono text-gray-400">ID: {{ order.id }}</p>
        <p class="font-bold text-lg text-blue-600">{{ order.totalAmount }} DH</p>
        <p class="text-[10px] text-gray-500 font-medium">🛒 {{ order.orderLines.length }} articles • Passée le {{
          order.createdAt | date:'short' }}</p>
      </div>
      <div class="flex items-center gap-4">
        <span [class]="'px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest ' +
                         (order.status === 'CREATED' ? 'bg-blue-50 text-blue-600' :
                          order.status === 'CANCELLED' ? 'bg-red-50 text-red-600' : 'bg-green-50 text-green-600')">
          {{ order.status }}
        </span>
        <button class="p-2 text-gray-400 hover:text-blue-600">👁️ Détails</button>
      </div>
    </div>
    } @empty {
    <div class="text-center py-20 bg-gray-50 rounded-3xl border-2 border-dashed border-gray-100">
      <p class="text-gray-400 font-bold italic">Vous n'avez pas encore de commandes.</p>
    </div>
    }
  </div>
</div>
