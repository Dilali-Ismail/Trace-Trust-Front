<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-md border border-gray-100">
  <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">Inscription</h2>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700">Nom complet</label>
      <input type="text" formControlName="name"
        class="mt-1 block w-full px-4 py-2 rounded-lg border-gray-300 bg-gray-50 focus:ring-blue-500">
      <p *ngIf="registerForm.get('name')?.invalid && registerForm.get('name')?.touched"
        class="text-xs text-red-500 mt-1">Le nom est requis.</p>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Email</label>
      <input type="email" formControlName="email"
        class="mt-1 block w-full px-4 py-2 rounded-lg border-gray-300 bg-gray-50 focus:ring-blue-500">
      <p *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched"
        class="text-xs text-red-500 mt-1">Email invalide.</p>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Mot de passe</label>
      <input type="password" formControlName="password"
        class="mt-1 block w-full px-4 py-2 rounded-lg border-gray-300 bg-gray-50 focus:ring-blue-500">
      <p *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched"
        class="text-xs text-red-500 mt-1">Min. 6 caractères.</p>
    </div>

    <p *ngIf="message" class="text-center text-sm"
      [ngClass]="message.includes('Erreur') || message.includes('Veuillez') ? 'text-red-500' : 'text-green-500'">{{
      message }}</p>

    <button type="submit" [disabled]="loading"
      class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition disabled:opacity-50">
      {{ loading ? 'Enregistrement...' : "S'inscrire" }}
    </button>
  </form>
  <p class="mt-6 text-center text-sm text-gray-600">
    Déjà un compte ? <a routerLink="/login" class="text-blue-600 font-semibold">Se connecter</a>
  </p>
</div>
