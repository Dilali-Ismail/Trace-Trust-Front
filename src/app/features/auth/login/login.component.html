<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-md border border-gray-100">
  <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">Connexion</h2>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
    <div>
      <label class="block text-sm font-medium text-gray-700">Email</label>
      <input type="email" formControlName="email"
        class="mt-1 block w-full px-4 py-3 rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 bg-gray-50">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700">Mot de passe</label>
      <input type="password" formControlName="password"
        class="mt-1 block w-full px-4 py-3 rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 bg-gray-50">
    </div>
    <p *ngIf="error" class="text-red-500 text-sm text-center">{{ error }}</p>
    <button type="submit" [disabled]="loginForm.invalid || loading"
      class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition disabled:opacity-50">
      {{ loading ? 'Chargement...' : 'Se connecter' }}
    </button>
  </form>
  <p class="mt-6 text-center text-sm text-gray-600">
    Pas encore de compte ? <a routerLink="/register" class="text-blue-600 font-semibold">S'inscrire</a>
  </p>
</div>
