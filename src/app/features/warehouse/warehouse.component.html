<div class="flex h-screen bg-gray-50 font-sans">

  <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-2xl">
    <div class="p-6">
      <h2 class="text-xl font-black tracking-tighter text-blue-400">T&T <span class="text-white">Logistics</span></h2>
      <p class="text-[10px] uppercase tracking-widest text-slate-500 font-bold mt-1">Espace Manager</p>
    </div>
    <nav class="flex-1 px-4 space-y-2 mt-4 text-sm font-medium">

      <a routerLink="/warehouse/dashboard" routerLinkActive="bg-slate-800 text-blue-400"
        class="flex items-center p-3 rounded-lg hover:bg-slate-800 transition group">
        <span class="mr-3 group-hover:scale-110 transition">🏠</span> Tableau de bord
      </a>

      <a routerLink="/warehouse/inventory" routerLinkActive="bg-slate-800 text-blue-400"
        class="flex items-center p-3 rounded-lg hover:bg-slate-800 transition group">
        <span class="mr-3 group-hover:scale-110 transition">📋</span> Mon Inventaire
      </a>

      <a routerLink="/warehouse/movements" routerLinkActive="bg-slate-800 text-blue-400"
        class="flex items-center p-3 rounded-lg hover:bg-slate-800 transition group">
        <span class="mr-3 group-hover:scale-110 transition">🔄</span> Flux de Stock
      </a>
    </nav>

    <div class="p-4 border-t border-slate-800">
      <button (click)="logout()" class="w-full flex items-center p-3 text-red-400 hover:bg-red-500/10 rounded-lg transition">
        <span class="mr-3">🚪</span> Déconnexion
      </button>
    </div>
  </aside>
 
  <main class="flex-1 flex flex-col overflow-hidden">
    <!-- Header -->
    <header class="bg-white border-b border-gray-100 p-4 flex justify-between items-center px-8">
      <div class="text-xs font-bold text-gray-400 uppercase tracking-widest">
        Dépôt : <span class="text-gray-800">Casablanca Hub</span>
      </div>
      <div class="flex items-center space-x-3">
        <div class="text-right">
          <p class="text-sm font-black text-gray-800 leading-none">{{ authService.userName() }}</p>
          <p class="text-[10px] text-blue-600 font-bold uppercase">Gestionnaire</p>
        </div>
        <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold text-xs shadow-inner">
          {{ authService.userName()?.charAt(0) }}
        </div>
      </div>
    </header>
    <!-- Zone de rendu des pages enfants -->
    <div class="flex-1 overflow-y-auto p-8">
       <router-outlet></router-outlet>
    </div>
  </main>
</div>
