<!-- 🎨 Premium 2026 Light Mode Header - E-commerce Style -->
<nav class="sticky top-0 z-50 bg-white border-b border-gray-100 shadow-soft">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16 items-center">

      <!-- 🏷️ LOGO SECTION -->
      <div class="flex items-center space-x-3">
        <a routerLink="/" class="flex items-center space-x-3 group">
          <!-- 📸 LOGO IMAGE - Replace with your own logo at: src/assets/images/logo.png -->
          <div
            class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center shadow-button group-hover:shadow-button-hover transition-all duration-300">
            <img src="assets/images/logo.png" alt="Logo" class="w-full h-full object-contain rounded-xl"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <span class="text-white font-bold text-lg hidden items-center justify-center" style="display:none;">T</span>
          </div>
          <span class="text-xl font-bold text-slate-800 group-hover:text-blue-600 transition-colors">
            Trace<span class="text-blue-500">AndTrust</span>
          </span>
        </a>
      </div>

      <!-- 🔍 CENTRAL SEARCH (Desktop only) -->
      <div class="hidden md:flex flex-1 max-w-lg mx-8">
        <div class="relative w-full group">
          <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
            <svg class="w-5 h-5 text-gray-400 group-focus-within:text-blue-500 transition-colors" fill="none"
              stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </div>
          <input type="text" placeholder="Rechercher un produit..."
            class="w-full pl-12 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-slate-800 placeholder-gray-400 focus:outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all">
          <div class="absolute inset-y-0 right-4 flex items-center pointer-events-none">
            <kbd
              class="hidden sm:inline-flex items-center px-2 py-1 text-xs text-gray-400 bg-white border border-gray-200 rounded-md">⌘K</kbd>
          </div>
        </div>
      </div>

      <!-- 🎛️ RIGHT SECTION -->
      <div class="flex items-center space-x-2">

        <!-- 🏠 Home Link -->
        <a routerLink="/"
          class="hidden sm:flex items-center px-4 py-2 text-sm font-medium text-gray-600 hover:text-blue-600 hover:bg-blue-50 rounded-xl transition-all duration-200">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6">
            </path>
          </svg>
          Accueil
        </a>

        <!-- 📊 Dashboard Links (role-based) -->
        <a *ngIf="authService.accessToken() && authService.role() === 'ADMIN'" routerLink="/admin/dashboard"
          class="hidden sm:flex items-center px-4 py-2 text-sm font-medium text-gray-600 hover:text-blue-600 hover:bg-blue-50 rounded-xl transition-all duration-200">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z">
            </path>
          </svg>
          Dashboard Admin
        </a>

        <a *ngIf="authService.accessToken() && authService.role() === 'WAREHOUSE_MANAGER'"
          routerLink="/warehouse/dashboard"
          class="hidden sm:flex items-center px-4 py-2 text-sm font-medium text-gray-600 hover:text-blue-600 hover:bg-blue-50 rounded-xl transition-all duration-200">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4">
            </path>
          </svg>
          Dashboard Entrepôt
        </a>

        <!-- 🛒 CLIENT LINKS (only for CLIENT role) -->
        <ng-container *ngIf="authService.accessToken() && authService.role() === 'CLIENT'">

          <!-- My Orders -->
          <a routerLink="/client"
            class="hidden sm:flex items-center px-4 py-2 text-sm font-medium text-gray-600 hover:text-blue-600 hover:bg-blue-50 rounded-xl transition-all duration-200">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01">
              </path>
            </svg>
            Mes Commandes
          </a>

          <!-- My Shipments -->
          <a routerLink="/client/shipments"
            class="hidden sm:flex items-center px-4 py-2 text-sm font-medium text-gray-600 hover:text-blue-600 hover:bg-blue-50 rounded-xl transition-all duration-200">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0">
              </path>
            </svg>
            Mes Expéditions
          </a>

          <!-- Cart Icon with Badge -->
          <a routerLink="/client/checkout"
            class="relative p-2 text-gray-600 hover:text-blue-600 hover:bg-blue-50 rounded-xl transition-all duration-200">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z">
              </path>
            </svg>
            <!-- Badge -->
            <span *ngIf="cartService.count() > 0"
              class="absolute -top-1 -right-1 w-5 h-5 bg-blue-500 text-white text-xs font-bold rounded-full flex items-center justify-center shadow-button animate-bounce">
              {{ cartService.count() }}
            </span>
          </a>
        </ng-container>

        <!-- 🔐 AUTH SECTION (Not Logged In) -->
        <div *ngIf="!authService.accessToken()" class="flex items-center space-x-2">
          <a routerLink="/login"
            class="px-4 py-2 text-sm font-medium text-gray-600 hover:text-blue-600 hover:bg-blue-50 rounded-xl transition-all duration-200">
            Connexion
          </a>
          <a routerLink="/register"
            class="px-5 py-2.5 text-sm font-semibold text-white bg-blue-500 hover:bg-blue-600 rounded-xl shadow-button hover:shadow-button-hover btn-ripple transition-all duration-300">
            S'inscrire
          </a>
        </div>

        <!-- 👤 USER MENU (Logged In) -->
        <div *ngIf="authService.accessToken()" class="flex items-center space-x-2">

          <!-- Logout Button -->
          <button (click)="logout()"
            class="flex items-center px-4 py-2 text-sm font-medium text-gray-600 hover:text-red-500 hover:bg-red-50 border border-transparent hover:border-red-200 rounded-xl transition-all duration-200">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
            </svg>
            <span class="hidden sm:inline">Déconnexion</span>
          </button>
        </div>

      </div>
    </div>
  </div>
</nav>
