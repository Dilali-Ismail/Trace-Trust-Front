<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>TraceAndTrust - Supply Chain Management</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TraceAndTrust - Plateforme E-commerce Logistique Premium">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            // 2026 Light E-commerce Palette
            light: {
              50: '#FAFAFA',
              100: '#F1F5F9',
              200: '#E2E8F0',
            },
            primary: {
              50: '#EFF6FF',
              100: '#DBEAFE',
              400: '#60A5FA',
              500: '#3B82F6',
              600: '#2563EB',
              700: '#1D4ED8',
            },
            success: '#10B981',
            warning: '#F59E0B',
            error: '#EF4444',
            info: '#8B5CF6',
          },
          boxShadow: {
            'soft': '0 2px 8px rgba(0, 0, 0, 0.04)',
            'card': '0 4px 12px rgba(0, 0, 0, 0.05)',
            'card-hover': '0 8px 24px rgba(0, 0, 0, 0.08)',
            'button': '0 2px 4px rgba(59, 130, 246, 0.2)',
            'button-hover': '0 4px 12px rgba(59, 130, 246, 0.3)',
          },
          borderRadius: {
            'xl': '12px',
            '2xl': '16px',
            '3xl': '20px',
          },
          animation: {
            'float': 'float 6s ease-in-out infinite',
            'fade-in': 'fadeIn 0.5s ease-out',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-10px)' },
            },
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Global light mode styles */
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #FAFAFA;
      color: #0F172A;
    }

    /* Card hover effect */
    .card-hover {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-hover:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.1);
    }

    /* Button ripple effect */
    .btn-ripple {
      position: relative;
      overflow: hidden;
    }

    .btn-ripple::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.3) 0%, transparent 70%);
      transform: scale(0);
      transition: transform 0.5s;
    }

    .btn-ripple:active::after {
      transform: scale(2);
    }

    /* Gradient text */
    .gradient-text {
      background: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #F1F5F9;
    }

    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }

    /* Focus ring */
    .focus-ring:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
    }

    /* Glass effect for light mode */
    .glass-light {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
</head>

<body class="antialiased">
  <app-root></app-root>
</body>

</html>
